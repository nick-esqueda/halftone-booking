# Runs the assistant's eval set against the real model. This costs money, so
# it runs only:
# - by hand (Actions > Assistant evals > Run workflow),
# - on a PR with the "run-evals" label (again on each push while labelled),
# - after a merge to main that changes the assistant or the evals.
# PRs from forks never run it, and this is the only workflow that reads the
# ANTHROPIC_API_KEY secret.
name: Assistant evals

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - "backend/app/assistant/**"
      - "backend/evals/**"

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.32"

jobs:
  evals:
    name: Assistant evals
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'run-evals') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_eval
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - name: Run the eval set
        run: uv run python -m evals.run_evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/booking_eval
