name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  UV_VERSION: "0.11.32"

jobs:
  backend:
    name: Backend (Black, ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - run: uv run black --check .
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest -rs
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/booking_test

  frontend:
    name: Frontend (Prettier, ESLint, tsc, Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: npm run build

  api-contract:
    name: API types up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd backend && uv sync --frozen
      - run: cd frontend && npm ci
      - run: make openapi
      - name: Fail if the generated files changed
        run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts

  e2e:
    name: End to end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      BOOKING_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/booking
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          # The API still runs under `uv run` when the job ends, so uv's cache
          # is in use and the post-job prune fails the job.
          prune-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the API
        working-directory: backend
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run python -m app.seed
          nohup uv run uvicorn app.main:app --port 8000 > api.log 2>&1 &
          timeout 30 sh -c 'until curl -sf localhost:8000/api/health; do sleep 1; done'
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: npm run e2e
        working-directory: frontend
      - if: failure()
        run: cat backend/api.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  docker:
    name: Docker stack starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start db, API and web
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check the API and the web app's proxy to it
        run: |
          curl -sf localhost:8000/api/equipment | grep -q "Camera A"
          curl -sf localhost:5173/api/config | grep -q "America/Chicago"
          curl -sf localhost:5173/ | grep -q "<div id=\"root\">"
      - if: failure()
        run: docker compose logs
