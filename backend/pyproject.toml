[project]
name = "halftone-booking-api"
version = "0.1.0"
description = "API for booking Halftone studio equipment"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "httpx2>=2.16.0",
    "hypothesis>=6.170.12",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Black owns formatting; ruff only lints.
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
