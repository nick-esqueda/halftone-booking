# Local development: database, API and web app, all with hot reload.
# `make up` starts it; the API runs migrations and seeds equipment on start,
# plus random demo bookings when the database has none (BOOKING_SEED_DEMO_BOOKINGS).
# API logs go to the console (`make logs`) and, as JSON lines, to ./logs/api.log.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-booking}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    # Run as your user so files in ./logs are yours, not root's (Linux hosts).
    # `make up` sets these; Docker Desktop on Mac and Windows maps them anyway.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # --reload-dir: watch only the code, never the log files.
    command: >
      sh -c "alembic upgrade head && python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    environment:
      BOOKING_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-booking}
      BOOKING_STUDIO_TIMEZONE: ${BOOKING_STUDIO_TIMEZONE:-America/Chicago}
      BOOKING_TIME_STEP_MINUTES: ${BOOKING_TIME_STEP_MINUTES:-15}
      BOOKING_SEED_DEMO_BOOKINGS: ${BOOKING_SEED_DEMO_BOOKINGS:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BOOKING_LLM_MODEL: ${BOOKING_LLM_MODEL:-claude-sonnet-5-5}
      BOOKING_LLM_EFFORT: ${BOOKING_LLM_EFFORT:-low}
      BOOKING_LOG_LEVEL: ${BOOKING_LOG_LEVEL:-DEBUG}
      BOOKING_LOG_LEVELS: ${BOOKING_LOG_LEVELS:-}
      BOOKING_LOG_SINKS: ${BOOKING_LOG_SINKS:-console,file}
      BOOKING_LOG_LLM_CONTENT: ${BOOKING_LOG_LLM_CONTENT:-false}
      BOOKING_LOG_DIR: /app/logs
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 3s
      timeout: 3s
      retries: 40
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    healthcheck:
      # Through Vite's proxy, so this also proves the web app can reach the API.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5173/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 40
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
